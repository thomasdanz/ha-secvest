[project]
name = "ha-secvest"
version = "0.1.10"
description = "Home Assistant integration for the ABUS Secvest alarm panel"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.1",
    # pins the matching Home Assistant release (current: 2026.9)
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ASYNC", "B", "C4", "D", "E", "F", "G", "I", "LOG", "N", "PL", "PT",
    "PTH", "RET", "RUF", "S", "SIM", "T20", "UP", "W",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "PLR2004",  # magic values are fine in comparisons with API values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    # the fake panel mirrors the panel's many cases
    "PLR0911", "PLR0912", "PLR0913", "PLR0917",
    "S105", "S106", "S107",  # test credentials
]
"scripts/**" = ["S603", "S607", "T201"]  # developer scripts calling git and printing

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# ship no type information (resvg_py: scripts/render_icon.py only)
module = ["pytest_homeassistant_custom_component.*", "resvg_py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
