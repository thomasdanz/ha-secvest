# Linting, type checks, tests, hassfest and HACS validation.
#
# Supported Home Assistant versions (ADR 0003): the current and the previous
# release. When a new release comes out:
#   1. pyproject.toml: pin pytest-homeassistant to the new release (its
#      version equals Home Assistant's), then run `uv lock`.
#   2. Below: move the old current release to the "previous" entry, with the
#      test package and version it was tested with.
#   3. README ("Supported versions") and changelog.
# The third test job guards the minimum declared in hacs.json (#150): it
# stays when the window moves, and changes only with that minimum, which is
# raised only when the code needs it.
# Test packages (#218): pytest-homeassistant exists from 2026.11 on; older
# releases use its predecessor pytest-homeassistant-custom-component (no
# releases after 2026.10.4). tests/ha/ imports from whichever is installed.
#
# Actions are pinned by commit, with the version as a comment; Dependabot
# (.github/dependabot.yml) proposes updates weekly, also for uv.lock. The
# exception is hassfest@master, which upstream recommends as is (#151).
# The current release's job measures coverage (lines and branches) and fails
# below 95 %; the report is kept as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy custom_components tests scripts

  tests:
    name: Tests (Home Assistant ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # current release: pytest-homeassistant as pinned in pyproject.toml
          - home-assistant: "2026.11"
            test-package: locked
            coverage: true
          # previous release
          - home-assistant: "2026.10"
            test-package: pytest-homeassistant-custom-component==0.13.375
          # the minimum in hacs.json: DeviceInfo's via_device_id needs 2026.8
          - home-assistant: "2026.8.0 (minimum)"
            test-package: pytest-homeassistant-custom-component==0.13.354
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # the two test packages provide the same fixtures: never both at once
      - if: matrix.test-package != 'locked'
        run: |
          uv pip uninstall pytest-homeassistant
          uv pip install "${{ matrix.test-package }}"
      - run: uv run --no-sync python -c "from homeassistant.const import __version__; print(__version__)"
      - if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest
      - if: ${{ matrix.coverage }}
        run: >-
          uv run --no-sync pytest
          --cov=custom_components/secvest --cov-branch --cov-fail-under=95
          --cov-report=term-missing:skip-covered --cov-report=html
      - if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: htmlcov/

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@master

  # Validates the repository on GitHub (default branch and settings), not the
  # checked-out commit: in a pull request, changes to hacs.json or the
  # manifest only count once they are on main. HACS reads hacs.json and the
  # manifest anonymously from raw.githubusercontent.com, which fails for a
  # private repository, so the job runs only once the repository is public.
  hacs:
    name: HACS validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # the integration is not listed in home-assistant/brands (yet)
          ignore: brands
          comment: false
